<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page Reconstruction (GoStartup Template)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="relative bg-gray-900 text-white font-sans overflow-x-hidden">

  <div class="absolute inset-0 -z-10">
    <div class="absolute top-0 left-0 w-[600px] h-[600px] bg-blue-600/40 rounded-full blur-[160px]"></div>
    <div class="absolute inset-0 bg-gradient-to-b from-black via-blue-900 to-gray-900"></div>
  </div>

 
  <nav class="sticky top-0 z-50 flex w-full items-center justify-between px-8 py-4 bg-transparent">
    <div class="flex items-center gap-2">
        <img src="log.png" alt="logo" class="h-10 w-auto">
      <span class="text-white font-bold text-2xl">GoStartup</span>
    </div>

    <div class="hidden md:flex items-center space-x-8">
      <a href="#" class="text-blue-400">Home</a>
      <a href="#" class="hover:text-blue-300">Features</a>
      <a href="#" class="hover:text-blue-300">Pages</a>
      <a href="#" class="hover:text-blue-300">Support</a>
      <button class="bg-indigo-500 px-4 py-2 rounded-lg">Sign In</button>
      <button class="bg-gray-700 px-4 py-2 rounded-lg">Sign Up</button>
    </div>
  </nav>

  
  <section class="container mx-auto px-8 py-20 flex flex-col md:flex-row items-center justify-between">

   
    <div class="md:w-1/2 space-y-6">
      <span class="bg-gray-800 text-sm px-4 py-2 rounded-full inline-block">
        Tailwind Template for Startups
      </span>

      <h1 class="text-5xl font-bold leading-tight">
        Digital Solutions for <br>
        Your <span class="underline decoration-blue-500">Startup</span>
      </h1>

      <p class="text-gray-400">
        Handcrafted Tailwind CSS template for your next Startup,
        Business, Agency or SaaS Website.
      </p>

      <div class="flex items-center gap-6">
        <button class="bg-indigo-500 px-6 py-3 rounded-lg">
          Get Started →
        </button>
        <a href="#" class="text-gray-300 hover:text-white">
          ▶ How it Work
        </a>
      </div>
    </div>

    
    <div class="relative md:w-1/2 mt-12 md:mt-0 flex justify-center">

      
      <div class="absolute bottom-0 w-64 h-64 bg-blue-500/30 rounded-full blur-3xl"></div>

     
      <img src="First image.jpg"
           class="w-80 rounded-xl shadow-xl relative z-10">

      <!-- Front Image -->
      <img src="https://images.unsplash.com/photo-1521737604893-d14cc237f11d"
           class="w-80 rounded-xl shadow-xl absolute top-20 left-40 z-20">
    </div>

  </section>

</body>
</html>
